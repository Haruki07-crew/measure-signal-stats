[project]
name = "labnote"
version = "0.1.0"
description = "実験ノート（Markdown＋SQLite の索引）と Discord bot"
readme = "README.md"
license = "MIT"
authors = [{ name = "Haruki07-crew" }]
# Pi の /usr/bin/python3（Raspberry Pi OS の版）でも動くように 3.11 以上にしている
requires-python = ">=3.11"
# CLI は標準ライブラリだけで動く。bot を使うときだけ --extra bot
dependencies = []

[project.optional-dependencies]
# discord.py の版は執筆時（2026年11月）に PyPI で確認したもの。上げるときは公式の変更履歴を読んでから
bot = ["discord.py==2.7.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
labnote = "labnote.cli:main"
labnote-bot = "labnote.bot:main"
labnote-send = "labnote.send:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labnote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["labnote", "conftest"]
